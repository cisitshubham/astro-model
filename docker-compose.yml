version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    command: >
      gunicorn astrology_platform.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile - --error-logfile - --capture-output --log-level info

    restart: always

    env_file:
      - .env

    networks:
      - root_default

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=root_default"

      - "traefik.http.routers.astro-model-prod.rule=Host(`engine.nakshatra.guru`)"
      - "traefik.http.routers.astro-model-prod.entrypoints=websecure"
      - "traefik.http.routers.astro-model-prod.tls=true"
      - "traefik.http.routers.astro-model-prod.tls.certresolver=mytlschallenge"
      - "traefik.http.services.astro-model-prod.loadbalancer.server.port=8000"
      - "traefik.http.services.astro-model-prod.loadbalancer.passhostheader=true"

networks:
  root_default:
    external: true
