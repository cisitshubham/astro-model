version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: astro-model-dev

    command: >
      sh -c "python3 manage.py migrate &&
             python3 manage.py collectstatic --noinput &&
             gunicorn panchang_engine.wsgi:application --bind 0.0.0.0:8000 --workers 3"

    restart: unless-stopped

    env_file:
      - .env

    networks:
      - root_default

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=root_default"

      - "traefik.http.routers.astro-model.rule=Host(`engine.nakshatra.guru`)"
      - "traefik.http.routers.astro-model.entrypoints=websecure"
      - "traefik.http.routers.astro-model.tls=true"
      - "traefik.http.routers.astro-model.tls.certresolver=mytlschallenge"

      - "traefik.http.services.astro-model.loadbalancer.server.port=8000"

networks:
  root_default:
    external: true
